name: "Poseidon Linux Non-Root Base Survey"
description: "Base non-root Linux survey using Poseidon native commands"
trigger: manual
run_as: self

steps:
  # Agent and host context

  - name: "print c2"
    description: "Print Poseidon's active C2 configuration"
    depends_on: []
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: print_c2

  - name: "config"
    description: "Get Poseidon configuration and host information"
    depends_on:
      - "print c2"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: config

  - name: "get user"
    description: "Get the current user context"
    depends_on:
      - "config"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: getuser

  - name: "timestamps"
    description: "Collect local time, UTC time, and Unix epoch"
    depends_on:
      - "get user"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "date; date -u; date +%s"

  - name: "enviroment"
    description: "Collect process environment variables"
    depends_on:
      - "timestamps"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: getenv

  - name: "host identity"
    description: "Collect sessions, cwd, identity, kernel, hostname, and OS release data"
    depends_on:
      - "enviroment"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "w; pwd; id; whoami; uname -a; hostname; cat /etc/os-*"

  # Filesystem survey

  - name: "list home"
    description: "Recursively list /home to depth 2"
    depends_on:
      - "host identity"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/home"
        depth: 2

  - name: "triage home"
    description: "Triage potentially interesting files under /home"
    depends_on:
      - "list home"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: triagedirectory
      params: "/home"

  - name: "list opt"
    description: "List /opt"
    depends_on:
      - "triage home"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/opt"

  - name: "list srv"
    description: "List /srv"
    depends_on:
      - "list opt"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/srv"

  - name: "list filesystem root"
    description: "List the filesystem root"
    depends_on:
      - "list srv"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/"

  - name: "list tmp"
    description: "List /tmp"
    depends_on:
      - "list filesystem root"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/tmp"

  - name: "list shared memory"
    description: "List /dev/shm"
    depends_on:
      - "list tmp"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/dev/shm"

  - name: "list var tmp"
    description: "List /var/tmp"
    depends_on:
      - "list shared memory"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/var/tmp"

  - name: "list var log"
    description: "Recursively list /var/log to depth 2"
    depends_on:
      - "list var tmp"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/var/log"
        depth: 2

  - name: "list web root"
    description: "Recursively list /var/www to depth 2"
    depends_on:
      - "list var log"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/var/www"
        depth: 2

  - name: "list passwd"
    description: "Get metadata for /etc/passwd"
    depends_on:
      - "list web root"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/etc/passwd"

  - name: "list shadow"
    description: "Get metadata for /etc/shadow without reading it"
    depends_on:
      - "list passwd"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ls
      params_dictionary:
        path: "/etc/shadow"

  - name: "login history"
    description: "Collect available login history"
    depends_on:
      - "list shadow"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "last -a 2>/dev/null"

  - name: "drives"
    description: "Enumerate mounted drives"
    depends_on:
      - "login history"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: drives

  - name: "inode usage"
    description: "Collect filesystem inode usage"
    depends_on:
      - "drives"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "df -i"

  - name: "mounts"
    description: "Collect mounted filesystem details"
    depends_on:
      - "inode usage"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "mount"

  - name: "process tree"
    description: "Collect a detailed process tree"
    depends_on:
      - "mounts"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "ps -elf --forest"

  - name: "interfaces"
    description: "Collect network interface information using Poseidon's native command"
    depends_on:
      - "process tree"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: ifconfig

  - name: "diagnostic modules"
    description: "Check loaded kernel modules for diagnostic-related entries"
    depends_on:
      - "interfaces"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "cat /proc/modules | grep diag"

  - name: "network sockets"
    description: "Collect listening and established network sockets"
    depends_on:
      - "diagnostic modules"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "netstat -antpu || ss -antpu"

  - name: "ip addresses"
    description: "Collect IP address configuration"
    depends_on:
      - "network sockets"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "ip -c a || ifconfig -a"

  - name: "routes"
    description: "Collect the routing table"
    depends_on:
      - "ip addresses"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "ip route || route -n"

  - name: "neighbors"
    description: "Collect the neighbor or ARP table"
    depends_on:
      - "routes"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "ip neigh || arp -an"

  - name: "recent filesystem changes"
    description: "Find files changed in the last 120 minutes on the root filesystem"
    depends_on:
      - "neighbors"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: >-
        find / -xdev -mmin -120 -printf '%M %u %g %s %TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -k6

  - name: "cron locations"
    description: "List common system and user cron locations"
    depends_on:
      - "recent filesystem changes"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "ls -latr /etc/cron* /etc/cron.* /var/spool/cron /var/spool/cron/crontabs /var/cron"

  - name: "system crontab"
    description: "Read the system crontab"
    depends_on:
      - "cron locations"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: cat
      params: "/etc/crontab"

  - name: "ptrace scope"
    description: "Collect the Yama ptrace restriction setting"
    depends_on:
      - "system crontab"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: shell
      params: "sysctl kernel.yama.ptrace_scope"

  - name: "download sshd config"
    description: "Download the OpenSSH server configuration when readable"
    depends_on:
      - "ptrace scope"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: download
      params: "/etc/ssh/sshd_config"

  - name: "download passwd"
    description: "Download the local account database"
    depends_on:
      - "download sshd config"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: download
      params: "/etc/passwd"

  - name: "download fstab"
    description: "Download the static filesystem configuration"
    depends_on:
      - "download passwd"
    inputs:
      CALLBACK_ID: env.display_id
    action: task_create
    continue_on_error: true
    action_data:
      callback_display_id: CALLBACK_ID
      command_name: download
      params: "/etc/fstab"
